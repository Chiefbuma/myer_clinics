version: '3'
services:
  laravel-app:
    build:
      context: .
      dockerfile: Dockerfile
    image: laravel-app
    container_name: laravel-app
    volumes:
      - .:/var/www
    depends_on:
      - laravel-mysql
    networks:
      - laravel_default

  laravel-nginx:
    image: nginx:latest
    container_name: laravel-nginx
    ports:
      - "8000:80"
    volumes:
      - .:/var/www
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - laravel-app
    networks:
      - laravel_default

  laravel-mysql:
    image: mysql:8.0
    container_name: laravel-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: laravel
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_USER: laravel
      MYSQL_PASSWORD: secret
    ports:
      - "3307:3307"
    volumes:
      - dbdata:/var/lib/mysql
    networks:
      - laravel_default

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: phpmyadmin
    restart: unless-stopped
    ports:
      - "8001:80"
    environment:
      PMA_HOST: laravel-mysql
      MYSQL_ROOT_PASSWORD: secret
    depends_on:
      - laravel-mysql
    networks:
      - laravel_default

networks:
  laravel_default:
    driver: bridge

volumes:
  dbdata:
